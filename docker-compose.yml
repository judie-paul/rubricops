services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rubricops
      POSTGRES_PASSWORD: rubricops-local
      POSTGRES_DB: rubricops
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - rubricops-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rubricops']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - '127.0.0.1:3001:3000'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rubricops:rubricops-local@db:5432/rubricops?schema=public
      AUTH_URL: http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
volumes:
  rubricops-data:
