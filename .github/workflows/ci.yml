name: Quality checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rubricops
          POSTGRES_PASSWORD: rubricops-local
          POSTGRES_DB: rubricops
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U rubricops"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rubricops:rubricops-local@localhost:55432/rubricops
      AUTH_SECRET: ci-only-secret-not-for-deployment-0000000000
      AUTH_URL: http://localhost:3001
      AUTH_TRUST_HOST: 'true'
      DEMO_MODE: 'true'
      DEMO_PASSWORD: rubricops-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/setup.mjs
      - run: npm run db:generate
      - run: make check
      - run: npm run db:migrate && npm run db:seed
      - run: PGPASSWORD=rubricops-local createdb -h localhost -p 55432 -U rubricops rubricops_test
      - run: make test-integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx next start -p 3001 > /tmp/rubricops.log 2>&1 &
      - run: node scripts/wait.mjs http://localhost:3001/login && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rubricops:test .
